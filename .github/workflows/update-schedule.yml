name: Update LPL schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-lpl-schedule
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LPL_YEAR: "2026"
      LPL_STAGE: "第三赛段"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update schedule
        run: node scripts/update-schedule.js

      - name: Run tests
        run: npm run check

      - name: Commit updated schedule
        run: |
          if git diff --quiet -- data/schedule.json data/schedules data/active.json; then
            echo "Schedule is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json data/schedules data/active.json
          git commit -m "Update LPL schedule"
          git push
